<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>MoreBounceLabs DJ Bot Lab</title>
<style>
body{background:#100e0c;color:#f4efe6;font:18px system-ui;padding:2rem}
iframe{width:100%;max-width:720px;height:220px;border:1px solid #e4a04a;border-radius:16px}
button{background:#e4a04a;border:0;border-radius:10px;padding:12px 18px;cursor:pointer}
</style></head>
<body>
<h1>MoreBounceLabs · DJ Bot Lab</h1>
<p>Local-only simulated playlist. A real mouse click will start each synthetic iframe track.</p>
<p>Selected track <strong data-track-index>1</strong> of __TRACK_COUNT__</p>
<iframe title="Simulated music player" data-dj-frame src="__EMBED_URL__/embed?track=0"></iframe>
<p><button type="button" data-dj-next>Next track</button></p>
<script>
const maximum = __TRACK_COUNT__;
const iframeBase = "__EMBED_URL__/embed?track=";
let index = 0;
const label = document.querySelector("[data-track-index]");
document.querySelector("[data-dj-next]").addEventListener("click", () => {
  if (index >= maximum - 1) return;
  index++;
  label.textContent = String(index + 1);
  document.querySelector("[data-dj-frame]").src = iframeBase + index;
});
</script>
</body></html>
