name: Backspin96 standalone build check

on:
  pull_request:
    branches: [main]
    paths:
      - "pages/backspin.html"
      - "public/backspin96*"
      - "scripts/build-backspin-offline-index.mjs"
      - "package.json"
      - "src/styles.css"
      - "src/pages-backspin.tsx"
      - "src/components/BackspinDecks.tsx"
      - "vite.pages.config.ts"
      - "scripts/verify-pages-build.mjs"
      - ".github/workflows/backspin-standalone-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Stage pinned Backspin engine
        run: python3 scripts/stage-backspin96.py
      - name: Build both public entry points
        run: npm run build:pages
      - name: Verify Pages assets and standalone booth
        run: npm run verify:pages
