name: More Bounce Labs checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies (Grok-export lockfile repair)
        run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: Music house regression tests
        run: node --experimental-strip-types --test scripts/house-logic.test.mjs scripts/dj-bot-core.test.mjs scripts/infinity-bridge.test.mjs scripts/soundcloud-archives.test.mjs
      - name: Verify Backspin source staging safeguards
        run: python3 -m unittest discover -s scripts -p 'test_backspin_stage.py'
      - name: Stage reviewed Backspin source pack (if present)
        run: python3 scripts/stage-backspin96.py
      - name: Production build
        run: npm run build
      - name: GitHub Pages static build
        run: npm run build:pages
      - name: GitHub Pages output verification
        run: npm run verify:pages

  dj-bot-lab:
    name: Opt-in DJ Bot fixture smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium for local synthetic browser test
        run: npx playwright install --with-deps chromium
      - name: Verify ten synthetic songs transition
        run: npm run dj:lab
